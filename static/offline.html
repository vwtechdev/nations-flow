<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sem conexão — Nations Flow</title>
    <style>
      :root {
        --primary-color: #673ab7;
        --primary-dark: #512da8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(121deg, #673ab7 0%, #9e65b5 100%);
        background-attachment: fixed;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .offline-card { max-width: 360px; }
      .offline-icon { font-size: 64px; line-height: 1; margin-bottom: 16px; }
      h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
      p { font-size: 15px; line-height: 1.5; opacity: 0.92; margin-bottom: 24px; }
      button {
        background: #fff;
        color: var(--primary-dark);
        border: none;
        border-radius: 24px;
        padding: 12px 32px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <div class="offline-icon">📡</div>
      <h1>Você está sem conexão</h1>
      <p>Não foi possível carregar esta página. Verifique sua internet e tente novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
